<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css"> 
    <title>Rancho Quiahuyo</title> 
</head>
<body>
<div class="main">
    <div class="branding">
        <div class="logo"> 
            <img src="images/logo.png" alt="Logo de Rancho Quiahuyo">
        </div>

        <div class="title">
        <h1>Rancho Quiahuyo</h1>
        </div>

        <div class="img-decoration">
        <img src="images/fondo.jpeg" alt="Fondo de Rancho Quiahuyo">
        </div>
        
    </div>    

   <form class="login-box"> <!--se usa form para el login -->
        <label class="inicio">Iniciar sesión en Rancho Quiahuyo</label>
        <input type="text" id="user" name="user">
        <input type="password" id="password" name="password"> 
        <button type="submit" class="btn-inicio">Iniciar Sesión</button>
        <label for="remember">¿Olvidaste tu contraseña?</label>
        <button type="submit" class="btn-facebook">Iniciar sesion con Facebook</button>
        <button class= "btn-create"type="submit">Crear cuenta nueva</button>
    </form>
</div>
 
</body>
</html>
