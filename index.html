<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css"> 
    <title>Rancho Quiahuyo</title> 
</head>
<body>
<div class="main">
    <div class="branding">
        <div class="logo"> 
            <img src="images/logo.png" alt="Logo de Rancho Quiahuyo">
        </div>

        <div class="title">
        <h1>Rancho Quiahuyo</h1>
        </div>

        <div class="img-decoration">
        <img src="images/fondo.jpeg" alt="Fondo de Rancho Quiahuyo">
        </div>
        
    </div>    

   <form class="login-box"> <!--se usa form para el login -->
        <label class="inicio">Iniciar sesión en Rancho Quiahuyo</label>
        <div class="input-group">
            <input placeholder=" " type="text" id="user" name="user">
            <label for="user">Numero de celular, nombre de usuario o correo electronico</label>
        </div>

        <div class="input-group">
            <input placeholder=" " type="password" id="password" name="password">
            <label for="password">Contraseña</label> 
        </div>
        
        <button type="submit" class="btn-inicio" disabled>Iniciar Sesión</button>
        <button type="button" class="btn-remember">¿Olvidaste tu contraseña?</button>
        <button type="submit" class="btn-facebook">Iniciar sesion con Facebook</button>
        <button class= "btn-create"type="submit">Crear cuenta nueva</button>
      
    </form>
</div>
 
</body>
</html>
