<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" type="text/css">
    <title>Rancho Quiahuyo</title>
</head>
<body>
<div class="main">
    <div class="branding">
        <div class="logo"> 
            <img src="images/logo.png" alt="Logo de Rancho Quiahuyo">
        </div>

        <div class="title">
        <h1>Los mejores huevos de la región, de Moroleon para el mundo</h1>
        </div>

        <div class="img-decoration">
        <img src="images/fondo.jpeg" alt="Fondo de Rancho Quiahuyo">
        </div>
        
    </div>    

   <form class="login-box" id="formLogin"> <!--se usa form para el login -->
        <h2 class="inicio">Iniciar sesión en Rancho Quiahuyo</h2>
        <div class="input-group">
            <input placeholder=" " type="text" id="user" name="user">
            <label for="user">Nombre de usuario</label>
        </div>

        <div class="input-group">
            <input placeholder=" " type="password" id="password" name="password">
            <label for="password">Contraseña</label> 
        </div>
        
        <button type="submit" class="btn-inicio" disabled id="loginbtn">Iniciar Sesión</button>

        <p id="loginMessage" class="success"></p>
        <p  id="loginMessage" class="error"></p>
        <button type="button" class="btn-remember" id="rememberbtn">¿Olvidaste tu contraseña?</button>
        <button type="button" class="btn-facebook" id="facebookbtn">Iniciar sesion con Facebook</button>
        <button class= "btn-create" type="button" id="btnCreateAccount">Crear cuenta nueva</button>
      
    </form>
</div>
     <script src="script.js"></script>
</body>
</html>
