
<div class="main">
    <div class="branding">
        <div class="logo"> 
            <img src="images/logo.png" alt="Logo de Rancho Quiahuyo">
        </div>

        <div class="title">
        <h1>Los mejores huevos de la región, de Moroleon para el mundo</h1>
        </div>

        <div class="img-decoration">
        <img src="images/fondo.jpeg" alt="Fondo de Rancho Quiahuyo">
        </div>
        
    </div>    

   <form class="login-box" id="formLogin" (ngSubmit)="iniciarSesion()"> <!--se usa form para el login -->
        <h2 class="inicio">Iniciar sesión en Rancho Quiahuyo</h2>
        <div class="input-group">
            <input placeholder=" " type="text" id="user" name="user" [(ngModel)]="username" (ngModelChange)="validarFormulario()">
            <label for="user">Nombre de usuario</label>
        </div>

        <div class="input-group">
            <input placeholder=" " type="password" id="password" name="password" [(ngModel)]="password" (ngModelChange)="validarFormulario()">
            <label for="password">Contraseña</label> 
        </div>
        
        <button type="submit" class="btn-inicio"  [disabled]="!botonHabilitado">Iniciar Sesión</button>

        <p  [class]="tipoMensaje">{{ mensaje }}</p>
        <button type="button" class="btn-remember" id="rememberbtn">¿Olvidaste tu contraseña?</button>
        <button type="button" class="btn-facebook" id="facebookbtn">Iniciar sesion con Facebook</button>
        <button class= "btn-create" type="button" id="btnCreateAccount">Crear cuenta nueva</button>
      
    </form>
</div>
